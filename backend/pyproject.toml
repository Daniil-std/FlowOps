[project]
name = "flowops"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.135,<1",
  "uvicorn>=0.34,<1",
  "pandas>=2.2.3,<4",
  "sqlalchemy>=2.0.38,<3",
  "alembic>=1.15,<2",
  "psycopg[binary]>=3.2.6,<4",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.22,<1",
  "openpyxl>=3.1.5,<4",
  "defusedxml>=0.7.1,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2", "pandas-stubs>=2.2.3", "types-openpyxl>=3.1", "types-defusedxml>=0.7"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires TEST_DATABASE_URL pointing to a disposable PostgreSQL database"]

