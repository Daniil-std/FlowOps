name: Checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: flowops
          POSTGRES_PASSWORD: flowops
          POSTGRES_DB: flowops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowops -d flowops_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://flowops:flowops@localhost:5432/flowops_test
      TEST_DATABASE_URL: postgresql+psycopg://flowops:flowops@localhost:5432/flowops_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r requirements.lock
      - run: pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -q
      - run: python -m unittest discover -s ../scripts -p "test_*.py"
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install playwright==1.64.0 openpyxl==3.1.5
      - run: python -m playwright install --with-deps chromium
      - name: Check production browser workflow
        run: |
          npm run preview -- --host 127.0.0.1 --port 5174 > /tmp/flowops-preview.log 2>&1 &
          python ../scripts/browser_demo_qa.py

